<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>HTML Formulare</title>
		<link rel="icon" href="favicon.ico" type="image/x-icon">
	</head>

	<body>
		<h1>HTML Formulare - Softwareschmiede Auftrag erstellen</h1>

		<ul>
			<li><a href="HTMLErsteSchritte.html">Hauptseite</a></li>
			<li><a href="HTMLMedien.html">Produktbeispiele</a></li>
			<li><a href="HTMLSemantik.html">Semantik Zitate</a></li>
			<li><a href="HTMLTabellen.html">Tabellen</a></li>
		</ul>
		
		<br>
		<br>

<textarea id="story" name="story" rows="5" cols="33">
Bitte geben sie Ihren Namen, Mail-Adresse und Art von Auftrag in das untere Formular ein.
Eine Antwort auf Ihren Auftrag kann 2-3 Werktage dauern.
</textarea>

		<br>
		<br>

		<form>
			<label for="mail">E-Mail:</label>
			<input type="search" id="mail" name="user-email">
			<label for="name">Name:</label>
			<input type="search" id="name" name="user-name">

			<br>
			<br>

			<fieldset>
				<p>Geben sie bitte die Art Ihres Auftrages an.</p>
				<input type="radio" id="ne" name="Auftrag" value="Neuentwicklung">
				<label for="ne">Neuentwicklung</label>

				<input type="radio" id="st" name="Auftrag" value="Softwaretest">
				<label for="st">Softwaretest</label>

				<input type="radio" id="de" name="Auftrag" value="Debugging">
				<label for="de">Debugging</label>

				<input type="radio" id="pm" name="Auftrag" value="Projektmanagement">
				<label for="pm">Projektmanagement</label>
			</fieldset>

			<br>
			
			<fieldset>
				<legend>Datenschutzbedingungen</legend>
				<input type="checkbox" name="datenschutz" value="zustimmenDs" id="check1">
				<label for="check1">Datenschutzrichtlinien zustimmen</label>
				<br>
				<br>
				<input type="radio" id="ds" name="datenschutz" value="zustimmenDs">
				<label for="ds">Ich habe die Datenschutzrichtlinien gelesen</label>
				<br>
				<input type="radio" id="ds2" name="datenschutz" value="zustimmenDs">
				<label for="ds2">Datenschutzrichtlinien akzeptieren</label>
			</fieldset>

			<br>
			<br>

			<button name="fulltext" value="1">Submit</button>
		</form>

	</body>

</html>
